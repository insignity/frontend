<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Практическое задание 7</title>
  <style>
    p:first-child {
      color: yellow
    }

    p:nth-child(3) {
      color: red
    }

    p:nth-child(even) {
      color: green
    }

    p:last-child {
      color: blue
    }
  </style>
</head>

<body>
  <p>Абзац номер один.</p>
  <p>Абзац номер два.</p>
  <p>Абзац номер три.</p>
  <p>Абзац номер четыре.</p>
  <p>Абзац номер пять.</p>
</body>

</html>
