<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
  rel="stylesheet"> -->

  <style>
    @font-face {
      font-family: MI;
      src: url('./fonts/Montserrat/static/Montserrat-Italic.ttf') format('truetype');
      font-optical-sizing: auto;
      font-weight: normal;
      font-style: italic;
    }

    p {
      font-size: 1em;
      /* кавычки при более 2 слов, sans-serif = разные семейства шрифтов */
      /* font-family: "Times New Roman", Georgia, sans-serif; */
      /* 
      font-family: "Montserrat", sans-serif;
      font-optical-sizing: auto;

      font-style: normal; */
      font-family: MI;
      font-weight: bolder;
      font-style: oblique;
      font-variant: small-caps;
      text-decoration: line-through;
      /* justify по ширине ровняет */
      text-align: justify;
      line-height: 120%;
      letter-spacing: 5px;
      word-spacing: 6px;
      /* Перенос слова когда длинное слово */
      word-break: break-all;
      text-shadow: -1px 4px 6px rgba(0, 0, 0, .7);
      /* Отступ */
      text-indent: 20px;
    }
  </style>
</head>

<body>
  <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Illum veniam reiciendis ullam. Similique dignissimos
    libero debitis. Libero asperiores numquam maiores.</p>
</body>

</html>
