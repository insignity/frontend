<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Практическое задание 18</title>
  <style>
    ul:first-of-type {
      color: red;
      list-style-type: circle;
    }

    ul+ol {
      list-style-type: lower-alpha;
      color: green
    }

    ul:last-of-type {
      list-style-type: square;
      color: blue
    }
  </style>
</head>

<body>
  <ul>
    <li>Элемент списка.</li>
    <li>Элемент списка.</li>
    <li>Элемент списка.</li>
  </ul>
  <ol>
    <li>Элемент списка.</li>
    <li>Элемент списка.</li>
    <li>Элемент списка.</li>
  </ol>
  <ul>
    <li>Элемент списка.</li>
    <li>Элемент списка.</li>
    <li>Элемент списка.</li>
  </ul>
</body>

</html>
