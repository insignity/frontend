<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Практическое задание 19</title>
  <style>
    * {
      padding: 0;
    }

    ul:first-of-type {
      list-style-position: inside;
      margin-left: 1em;
    }

    ul:first-of-type>li::before {
      content: "🙂 "
    }


    li {
      list-style-type: none;
    }

    ul+ul>li {
      margin-left: 2em;
    }

    ul+ul>li::before {
      content: "▶ ";
      color: green;
      padding-right: 0.4em;
    }
  </style>
</head>

<body>
  <ul>
    <li>Элемент списка.</li>
    <li>Элемент списка.</li>
    <li>Элемент списка.</li>
  </ul>
  <ul>
    <li>Элемент списка.</li>
    <li>Элемент списка.</li>
    <li>Элемент списка.</li>
  </ul>
</body>

</html>
