<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Практическое задание 11</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
    rel="stylesheet">
  <style>
    h2 {
      font-size: 1.4em;
      font-family: Ubuntu;
      /* justify по ширине ровняет */
      text-align: justify;
      line-height: 120%;
      word-spacing: 6px;
      text-align: center;
      color: red;
    }

    p {
      font-size: 1em;
      font-family: "Ubuntu", sans-serif;
      font-weight: 400;
      font-style: normal;
      /* justify по ширине ровняет */
      text-align: justify;
      line-height: 100%;
    }


    b {
      font-size: 1em;
      font-family: "Ubuntu", sans-serif;
      font-weight: 700;
      font-style: normal;
      /* justify по ширине ровняет */
      text-align: justify;
      line-height: 100%;
    }


    i {
      font-size: 1em;
      font-family: "Ubuntu", sans-serif;
      font-weight: 400;
      font-style: italic;
      /* justify по ширине ровняет */
      text-align: justify;
      line-height: 100%;
    }
  </style>
</head>

<body>
  <h2>Омары</h2>
  <p><b>Омары</b> (лат. <i>Nephropidae</i>) — семейство крупных морских <i>десятиногих ракообразных</i>.</p>
  <p>В просторечии, в отношении употребляемых в пищу <b>омаров</b> и <b>лангустов</b> также употребляется калька
    <b>«лобстеры»</b> (от англ. <i>lobsters</i> — <b>омары</b>).
  </p>
</body>

</html>
