<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .radio {
      display: none;
    }

    .custom-radio {
      width: 1em;
      height: 1em;
      border: 1px solid black;
      border-radius: 50%;
    }

    label {
      padding-left: 50px;
      position: relative;
    }

    label::before {
      content: "";
      position: absolute;
      top: -4px;
      left: 0;
      right: 0;
      display: inline-block;
      width: 50px;
      height: 26px;
      background: #cdd1da;
      border-radius: 12px;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, .2);
      transition: 1s;
    }


    .radio+label::after {
      content: "";
      border-radius: 50%;
      background-color: #fff;
      position: absolute;
      width: 22px;
      height: 22px;
      top: -2px;
      left: 2px;
      box-shadow: 0 2px rgba(0, 0, 0, .3);
      transition: 1s;
    }

    .radio:checked+label::after {
      left: 25px;
    }

    .radio:checked+label::before {
      background: green;
    }
  </style>
</head>

<body>
  <input type="checkbox" name="radio" class="radio" id="test">
  <label for="test">lorem</label>
</body>

</html>
