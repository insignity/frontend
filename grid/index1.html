<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <style>
    section {
      display: grid;
      /* лучше делать с repeat */
      grid-template-rows: repeat(3, 100px);
      grid-template-columns: 2fr repeat(2, 1fr);
      grid-gap: 10px 20px;
    }

    article {
      background: gold;
    }
  </style>
</head>

<body>
  <section>
    <article></article>
    <article></article>
    <article></article>
    <article></article>
    <article></article>
    <article></article>
    <article></article>
    <article></article>
    <article></article>
  </section>
</body>

</html>
